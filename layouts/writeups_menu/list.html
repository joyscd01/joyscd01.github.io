{{- define "main" }}

<!-- La nostra barra di ricerca stile terminale -->
<div class="hacker-search-container">
    <span class="prompt">root@0xe29884:~# grep -i </span>
    <input type="text" id="writeupSearch" placeholder="'box name'..." autocomplete="off">
</div>

<!-- Il contenuto originale con le tendine -->
<div class="post-content hacker-directory">
  {{ .Content }}
</div>

<!-- Lo script per il filtro istantaneo -->
<script>
document.getElementById('writeupSearch').addEventListener('keyup', function() {
    let rawSearch = this.value.toLowerCase();
    let isTechSearch = rawSearch.startsWith('$');
    // Rimuove il $ iniziale per fare la vera e propria ricerca
    let filter = isTechSearch ? rawSearch.substring(1).trim() : rawSearch.trim();
    
    let categoryBlocks = document.querySelectorAll('.hacker-directory details:not(.tech-dropdown)');

    categoryBlocks.forEach(category => {
        let items = category.querySelectorAll('li');
        let hasVisibleItem = false;

        items.forEach(item => {
            let techDetails = item.querySelector('.tech-dropdown');
            let techText = techDetails ? techDetails.textContent.toLowerCase() : "";
            
            // Separiamo logicamente il testo della macchina da quello dei tag
            let mainText = item.textContent.toLowerCase().replace(techText, "");
            
            let isMatch = false;

            if (rawSearch === '') {
                isMatch = true; // Barra vuota: mostra tutto
            } else if (isTechSearch) {
                // Modalità Cheatsheet: cerca SOLO nelle tecniche (se ha digitato qualcosa dopo il $)
                if (filter !== '' && techText.includes(filter)) {
                    isMatch = true;
                }
            } else {
                // Ricerca Normale: cerca SOLO nel nome della macchina e nell'OS
                if (mainText.includes(filter)) {
                    isMatch = true;
                }
            }

            if (isMatch) {
                item.style.display = '';
                if (rawSearch !== '') hasVisibleItem = true;
                
                // Se c'è un match in modalità tecnica, apri la tendina per evidenziarlo
                if (techDetails) {
                    techDetails.open = (isTechSearch && filter !== '');
                }
            } else {
                item.style.display = 'none';
                if (techDetails) techDetails.open = false;
            }
        });

        // Gestione espansione automatica delle categorie (Easy, Medium, ecc.)
        if (rawSearch !== '') {
            if (hasVisibleItem) {
                category.open = true;
                category.style.display = '';
            } else {
                category.style.display = 'none';
            }
        } else {
            // Se la barra viene svuotata, richiudi tutte le categorie
            category.style.display = '';
            category.open = false;
        }
    });
});
</script>

{{- end }}
